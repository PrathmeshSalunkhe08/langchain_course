[project]
name = "langchain-full-playlist"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Prathmesh Salunkhe", email = "prathameshsalunkhe102@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.2",
    "langchain-groq>=1.1.3",
    "langsmith>=0.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
langchain-full-playlist = "langchain_full_playlist:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.isort]
profile = "black"

